<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TaxAgent · 智能税务助手</title>
    <style>
        .conv-spinner { width:10px;height:10px;border:2px solid #22a06044;border-top-color:#22a060;border-radius:50%;animation:conversation-spin .8s linear infinite;flex-shrink:0; }
        @keyframes conversation-spin { to { transform:rotate(360deg); } }
        :root {
            --primary: #4d6bfe;
            --primary-soft: #eef0ff;
            --bg: #ffffff;
            --bg-sidebar: #f7f7f8;
            --bg-chat: #ffffff;
            --text: #1a1a1a;
            --text-dim: #8a8a8a;
            --border: #e5e5e5;
            --bubble-user: #eef0ff;
            --hover: #ececec;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
        }
        [data-theme="dark"] {
            --primary: #4d6bfe;
            --primary-soft: #2a2f4a;
            --bg: #1a1a1a;
            --bg-sidebar: #212121;
            --bg-chat: #1a1a1a;
            --text: #ececec;
            --text-dim: #9a9a9a;
            --border: #333;
            --bubble-user: #2a2f4a;
            --hover: #2a2a2a;
            --code-bg: #111;
            --code-text: #d4d4d4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            overflow: hidden;
            font-size: 15px;
            line-height: 1.6;
        }
        .app { display: flex; height: 100%; }

        /* ---------- 侧边栏 ---------- */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: margin-left .2s ease;
        }
        .sidebar.collapsed { margin-left: -260px; }
        .sidebar-header { padding: 12px; }
        .new-chat-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .new-chat-btn:hover { filter: brightness(1.05); }
        .conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
        .conv-group-label { font-size: 12px; color: var(--text-dim); padding: 12px 8px 4px; }
        .conv-item {
            position: relative;
            display: flex;
            align-items: center;
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item:hover { background: var(--hover); }
        .conv-item.active { background: var(--primary-soft); }
        .conv-item .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .conv-item .conv-actions { display: none; gap: 2px; }
        .conv-item:hover .conv-actions { display: flex; }
        .conv-item .conv-actions button {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-dim); font-size: 13px; padding: 2px 4px; border-radius: 4px;
        }
        .conv-item .conv-actions button:hover { background: var(--border); color: var(--text); }
        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .icon-btn {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-dim); font-size: 16px; padding: 8px; border-radius: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .icon-btn:hover { background: var(--hover); color: var(--text); }
        .sidebar-footer .spacer { flex: 1; }

        /* ---------- 主区域 ---------- */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-header {
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
        }
        .main-title { flex: 1; text-align: center; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .model-select {
            padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer;
        }

        /* ---------- 聊天区 ---------- */
        .chat { flex: 1; overflow-y: auto; padding: 24px 16px; scroll-behavior: auto; }
        .chat-inner { max-width: 820px; margin: 0 auto; }
        .welcome { max-width: 820px; margin: 60px auto 0; text-align: center; }
        .welcome h2 { font-size: 26px; margin-bottom: 8px; }
        .welcome p { color: var(--text-dim); margin-bottom: 28px; }
        .suggestion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 560px; margin: 0 auto; }
        .suggestion-card {
            padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
            cursor: pointer; text-align: left; font-size: 14px; color: var(--text);
            background: var(--bg);
        }
        .suggestion-card:hover { border-color: var(--primary); background: var(--primary-soft); }

        .message { display: flex; flex-direction: column; margin-bottom: 20px; }
        .message.user { align-items: flex-end; }
        .message.assistant { align-items: flex-start; }
        .message .bubble {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.6;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .message.user .bubble { background: var(--bubble-user); border-bottom-right-radius: 4px; max-width: 78%; }
        .message.assistant .bubble { background: transparent; padding-left: 0; padding-right: 0; width: 100%; max-width: 100%; }

        /* 消息操作按钮：位于消息底部独立一行，小符号，不挤占气泡 */
        .msg-actions {
            display: flex;
            gap: 2px;
            margin-top: 2px;
            opacity: 0;
            transition: opacity .15s;
            width: 100%;
        }
        .message:hover .msg-actions { opacity: 1; }
        .message.user .msg-actions { justify-content: flex-end; }
        .message.assistant .msg-actions { justify-content: flex-start; }
        .msg-actions button {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-dim); font-size: 11px; padding: 3px 7px; border-radius: 5px;
        }
        .msg-actions button:hover { background: var(--hover); color: var(--text); }

        /* ---------- markdown 元素 ---------- */
        .bubble p { margin: 6px 0; }
        .bubble h1, .bubble h2, .bubble h3 { margin: 14px 0 6px; font-weight: 600; }
        .bubble h1 { font-size: 20px; } .bubble h2 { font-size: 17px; } .bubble h3 { font-size: 15px; }
        .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
        .bubble li { margin: 3px 0; }
        .bubble code.inline {
            background: var(--hover); padding: 1px 5px; border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace; font-size: 13px;
        }
        .bubble table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 14px; }
        .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
        .bubble th { background: var(--bg-sidebar); font-weight: 600; }
        .bubble blockquote { border-left: 3px solid var(--primary); padding-left: 12px; color: var(--text-dim); margin: 8px 0; }
        .code-block { margin: 10px 0; border-radius: 10px; overflow: hidden; background: var(--code-bg); }
        .code-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 12px; background: rgba(255,255,255,.06); color: #aaa; font-size: 12px;
        }
        .code-copy { background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
        .code-copy:hover { color: #fff; background: rgba(255,255,255,.1); }
        .code-block pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
        .code-block code { color: var(--code-text); font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.5; }
        .think-panel { border: 1px solid var(--border); border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .think-toggle { width: 100%; text-align: left; padding: 8px 14px; background: var(--bg-sidebar); border: none; cursor: pointer; color: var(--text-dim); font-size: 13px; }
        .think-body { padding: 10px 14px; color: var(--text-dim); font-size: 13px; white-space: pre-wrap; display: none; border-top: 1px solid var(--border); }
        .think-body.open { display: block; }

        /* ---------- 输入区 ---------- */
        .composer { flex-shrink: 0; padding: 12px 16px 16px; }
        .composer-inner { max-width: 820px; margin: 0 auto; position: relative; }
        .composer-box {
            display: flex; align-items: flex-end; gap: 8px;
            border: 1px solid var(--border); border-radius: 16px;
            padding: 8px 10px; background: var(--bg);
        }
        .composer-box:focus-within { border-color: var(--primary); }
        .attach-btn { background: transparent; border: none; cursor: pointer; color: var(--text-dim); font-size: 18px; padding: 4px; }
        .attach-btn:hover { color: var(--text); }
        .composer textarea {
            flex: 1; border: none; outline: none; resize: none; background: transparent;
            color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.5;
            max-height: 200px; padding: 6px 4px;
        }
        .send-btn {
            background: var(--primary); color: #fff; border: none; cursor: pointer;
            width: 34px; height: 34px; border-radius: 50%; font-size: 16px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .send-btn.stop { background: #e5484d; border-radius: 8px; font-size: 14px; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* 上传预览区 */
        .upload-preview {
            display: flex; flex-wrap: wrap; gap: 8px; padding: 0 4px 10px 4px;
            max-width: 820px; margin: 0 auto;
        }
        .upload-card {
            position: relative; display: flex; align-items: center; gap: 8px;
            background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
            padding: 8px 10px; min-width: 180px; max-width: 260px;
        }
        .upload-card.error { border-color: #e5484d; background: #fff5f5; }
        [data-theme="dark"] .upload-card.error { background: #2a1010; }
        .upload-thumb {
            width: 40px; height: 40px; border-radius: 6px; object-fit: cover;
            background: var(--hover); flex-shrink: 0;
        }
        .upload-file-icon {
            width: 40px; height: 40px; border-radius: 6px;
            background: var(--primary-soft); color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 600; flex-shrink: 0;
        }
        .upload-info { flex: 1; min-width: 0; }
        .upload-filename {
            font-size: 12px; font-weight: 500; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .upload-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
        .upload-progress {
            width: 100%; height: 3px; background: var(--hover); border-radius: 2px;
            margin-top: 4px; overflow: hidden;
        }
        .upload-progress-fill {
            height: 100%; background: var(--primary); border-radius: 2px;
            transition: width .15s;
        }
        .upload-progress-fill.done { background: #52c41a; }
        .upload-progress-fill.error { background: #e5484d; }
        .upload-remove {
            position: absolute; top: -6px; right: -6px;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--bg); border: 1px solid var(--border);
            color: var(--text-dim); font-size: 11px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .upload-remove:hover { background: #e5484d; color: #fff; border-color: #e5484d; }
        .upload-retry {
            font-size: 11px; color: #e5484d; cursor: pointer; margin-top: 2px;
        }

        .composer-hint { text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 6px; }
        .source-filter { display: flex; gap: 14px; justify-content: center; margin-top: 6px; font-size: 12px; color: var(--text-dim); }
        .source-filter label { cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .source-filter input { accent-color: var(--primary); }
        .back-to-bottom {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
            padding: 6px 14px; cursor: pointer; color: var(--text); font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08); display: none; z-index: 10;
        }
        .typing-cursor::after { content: '▍'; animation: blink .8s infinite; color: var(--primary); }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #323232; color: #fff; padding: 8px 20px; border-radius: 8px;
            font-size: 13px; z-index: 2000; display: none;
        }
        .toast.error { background: #e5484d; }

        /* 角色徽章 & 下拉 */
        .role-badge-wrapper { position: relative; }
        .role-badge {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 10px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-size: 13px; cursor: pointer;
            white-space: nowrap;
        }
        .role-badge:hover { background: var(--hover); }
        .role-badge.admin { border-color: #e6a817; background: #fff8e6; }
        [data-theme="dark"] .role-badge.admin { background: #2a2510; }
        .role-arrow { font-size: 10px; color: var(--text-dim); }
        .role-dropdown {
            display: none; position: absolute; top: 100%; right: 0;
            margin-top: 4px; min-width: 150px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
            z-index: 100; overflow: hidden;
        }
        .role-dropdown.show { display: block; }
        .role-option {
            padding: 10px 14px; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }
        .role-option:hover { background: var(--hover); }
        .role-option.active { background: var(--primary-soft); font-weight: 500; }

        /* 设置弹窗 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--bg); border-radius: 14px; padding: 24px; width: 480px; max-height: 82vh; overflow-y: auto; color: var(--text); }
        .modal h3 { font-size: 17px; margin-bottom: 16px; }
        .modal .section-title { font-size: 14px; font-weight: 600; margin: 14px 0 8px; }
        .modal label { display: block; font-size: 13px; color: var(--text-dim); margin: 8px 0 4px; }
        .modal input, .modal select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--bg); color: var(--text); margin-bottom: 4px; }
        .modal .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
        .modal .btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; }
        .modal .btn-primary { background: var(--primary); color: #fff; }
        .modal .btn-cancel { background: var(--hover); color: var(--text); }

        /* 移动端：侧边栏变抽屉 */
        .sidebar-backdrop { display: none; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 500; margin-left: 0; }
            .sidebar.collapsed { margin-left: -260px; }
            .sidebar-backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 400; }
            .composer { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
            .suggestion-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="newConversation()">
                    <span>+</span> 新对话
                </button>
            </div>
            <div class="conv-list" id="conv-list"></div>
            <div class="sidebar-footer">
                <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
                <button class="icon-btn" id="settings-btn" onclick="showSettings()" title="模型配置">⚙</button>
                <button class="icon-btn" onclick="location.href='/knowledge?session_id='+encodeURIComponent(currentSessionId)" title="我的文档：浏览与删除">📄</button>
                <button class="icon-btn" onclick="window.open('/policy#policy-section', '_blank', 'noopener')" title="政策更新">📜</button>
                <span class="spacer"></span>
                <span style="font-size:12px;color:var(--text-dim)" id="me-label">👤 普通用户</span>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

        <!-- 主区域 -->
        <main class="main">
            <header class="main-header">
                <button class="icon-btn" onclick="toggleSidebar()" title="折叠侧边栏">☰</button>
                <div class="main-title" id="main-title">税务智能助手</div>
                <div class="role-badge-wrapper">
                    <button class="role-badge" id="role-badge" onclick="toggleRoleMenu(event)" title="点击切换用户/管理员模式">
                        <span id="role-icon">👤</span> <span id="role-label">普通用户</span> <span class="role-arrow">▾</span>
                    </button>
                    <div class="role-dropdown" id="role-dropdown">
                        <div class="role-option" data-role="user" onclick="switchRole('user')">👤 普通用户</div>
                        <div class="role-option" data-role="admin" onclick="switchRole('admin')">🛡️ 管理员</div>
                    </div>
                </div>
                <select class="model-select" id="model-select" onchange="onModelChange()"></select>
            </header>

            <div class="chat" id="chat">
                <div class="chat-inner" id="chat-inner">
                    <div class="welcome" id="welcome">
                        <h2>你好，我是税务助手</h2>
                        <p>我可以帮你解答发票合规、增值税、企业所得税、个人所得税等问题</p>
                        <div class="suggestion-grid" id="suggestion-grid"></div>
                    </div>
                </div>
            </div>
            <button class="back-to-bottom" id="back-to-bottom" onclick="scrollToBottom()">↓ 回到底部</button>

            <div class="composer" id="composer">
                <div class="composer-inner">
                    <div id="workflow-panel" hidden style="padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px"></div>
                    <div class="upload-preview" id="upload-preview"></div>
                    <div class="composer-box" id="composer-box">
                        <button class="attach-btn" id="attach-btn" onclick="document.getElementById('file-input').click()" title="上传文件">📎</button>
                        <textarea id="user-input" rows="1" placeholder="输入你的税务问题…（Enter 发送，Shift+Enter 换行）"></textarea>
                        <input type="file" id="file-input" multiple hidden accept=".txt,.md,.pdf,.docx,.xlsx,.csv,.jpg,.jpeg,.png" onchange="handleFiles(this.files)">
                        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
                    </div>
                    <div class="source-filter">
                        <label><input type="checkbox" id="chk-web" onchange="updateSourceTypes()"> 联网检索最新政策</label>
                        <label>上传范围 <select id="upload-scope"><option value="session">仅当前对话</option><option value="global">我的所有对话</option></select></label>
                    </div>
                    <div class="composer-hint">内容由 AI 生成，仅供参考，请以当地税务机关为准</div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h3>⚙ 模型配置</h3>
            <div class="section-title">LLM 对话模型</div>
            <label>提供商</label><select id="cfg-llm-provider" onchange="selectProvider('llm')"></select>
            <label>模型 ID（可自定义）</label><input id="cfg-llm-model" list="llm-models" placeholder="填写服务商提供的模型 ID"><datalist id="llm-models"></datalist>
            <label>API Key</label><input id="cfg-llm-key" type="password" placeholder="留空则不修改" autocomplete="off">
            <label>Base URL</label><input id="cfg-llm-url" type="text" placeholder="https://open.bigmodel.cn/api/paas/v4/">
            <div><button class="btn" onclick="probeModels('llm', this)">🔗 检测连接</button> <button class="btn" onclick="probeModels('llm', this)">🔍 获取模型列表</button></div>
            <p id="cfg-llm-status" role="status"></p>

            <div class="section-title">Qdrant 向量存储监控</div>
            <label>Qdrant URL</label><input id="cfg-qdrant-url" placeholder="https://your-cluster.qdrant.io 或 http://localhost:6333">
            <label>API Key（同一地址留空保留；新地址留空适用于无鉴权的自建实例）</label><input id="cfg-qdrant-key" type="password" autocomplete="off">
            <label>向量数预警上限（可自定，0 表示不设数量上限）</label><input id="cfg-qdrant-limit" type="number" min="0" step="1" value="0">
            <button class="btn" onclick="refreshQdrant(this)">🔄 刷新</button><p id="cfg-qdrant-status" role="status"></p>
            <p style="font-size:12px;color:var(--text-dim)">刷新查询已保存的地址。空间仅估算向量正文，不含索引和文档；免费版按资源限制，无固定向量数上限。切换地址不迁移数据；Embedding 必须与集合维度一致。</p>
            <label>访问 Token（自定义鉴权时填写，留空使用演示 Token）</label><input id="cfg-auth-token" type="password" autocomplete="off">
            <p style="font-size:12px;color:var(--text-dim)">模型设置对当前服务所有会话生效；API Key 留空保留原值。</p>
            <div class="section-title" style="border-top:1px solid var(--border);padding-top:14px;margin-top:14px">🔑 身份认证 Token</div>
            <label>普通用户 Token</label><input id="cfg-user-token" type="password" autocomplete="off" placeholder="test_token_123">
            <label>管理员 Token</label><input id="cfg-admin-token" type="password" autocomplete="off" placeholder="admin_token_456">
            <p style="font-size:12px;color:var(--text-dim);margin-top:4px">当前模式：<span id="cfg-current-role">—</span> — 保存后，在页面顶部角色按钮切换即可生效</p>
            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeSettings()">取消</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ====== 角色/Token 管理 ======
        const DEFAULT_USER_TOKEN = 'test_token_123';
        const DEFAULT_ADMIN_TOKEN = 'admin_token_456';
        let currentRole = sessionStorage.getItem('tax_agent_role') || 'user';

        function getTokenForRole(role) {
            const stored = sessionStorage.getItem('tax_agent_' + role + '_token');
            return stored || (role === 'admin' ? DEFAULT_ADMIN_TOKEN : DEFAULT_USER_TOKEN);
        }
        function getAuthToken() {
            return 'Bearer ' + getTokenForRole(currentRole);
        }
        let AUTH_TOKEN = getAuthToken();
        const chat = document.getElementById('chat');
        const chatInner = document.getElementById('chat-inner');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let currentSessionId = localStorage.getItem('tax_agent_session_id') || 'session_' + Date.now();
        let selectedSourceTypes = ['default', 'user_upload'];
        let abortController = null;
        let autoScroll = true;
        let streaming = false;
        let pendingWorkflow = null;
        let currentWorkflow = {};
        const sessionStreams = new Map();
        const conversationViews = new Map();

        function saveCurrentView() {
            conversationViews.set(currentSessionId, {...conversationViews.get(currentSessionId), nodes:Array.from(chatInner.childNodes), draft:userInput.value,
                files:pendingFiles, uploadNodes:Array.from(document.getElementById('upload-preview').childNodes),
                workflow:currentWorkflow, title:document.getElementById('main-title').textContent});
        }
        function restoreView(sessionId) {
            const view = conversationViews.get(sessionId);
            chatInner.replaceChildren(...(view?.nodes || []));
            userInput.value = view?.draft || ''; userInput.dispatchEvent(new Event('input'));
            pendingFiles = view?.files || [];
            document.getElementById('upload-preview').replaceChildren(...(view?.uploadNodes || []));
            showWorkflow(view?.workflow || {});
            document.getElementById('main-title').textContent = view?.title || '税务智能助手';
            updateSendBtn();
        }
        function showSessionWorkflow(sessionId, data) {
            if (sessionId === currentSessionId) showWorkflow(data);
            else if (conversationViews.has(sessionId)) conversationViews.get(sessionId).workflow = data;
        }

        function showWorkflow(data) {
            currentWorkflow = data;
            pendingWorkflow = data.pending || null;
            const panel = document.getElementById('workflow-panel');
            panel.replaceChildren();
            panel.hidden = !pendingWorkflow && !(data.artifacts || []).length;
            if (pendingWorkflow) {
                const title = document.createElement('strong');
                title.textContent = pendingWorkflow.kind === 'approval' ? '等待人工审批：' + pendingWorkflow.title : '请补充信息：' + pendingWorkflow.question;
                panel.appendChild(title);
                const preview = document.createElement('pre');
                preview.textContent = pendingWorkflow.preview || '';
                preview.style.cssText = 'white-space:pre-wrap;max-height:160px;overflow:auto';
                panel.appendChild(preview);
                const notice = document.createElement('p'); notice.textContent = pendingWorkflow.notice;
                panel.appendChild(notice);
                if (pendingWorkflow.kind === 'approval') {
                    panel.appendChild(makeActionBtn('批准生成', () => resumeApproval(true)));
                    panel.appendChild(makeActionBtn('拒绝并终止', () => resumeApproval(false)));
                }
            }
            for (const item of data.artifacts || []) {
                panel.appendChild(makeActionBtn('下载：' + item.title, () => downloadArtifact(item.id)));
            }
        }
        async function refreshWorkflow() {
            const sid = currentSessionId;
            const resp = await fetch(`/api/conversations/${encodeURIComponent(sid)}/workflow`, {headers:{Authorization:AUTH_TOKEN}});
            if (sid !== currentSessionId) return;
            if (resp.status === 404) { showWorkflow({}); return; }
            if (!resp.ok) { const error = await resp.json(); throw new Error(error.detail || '读取工作流失败'); }
            const data = await resp.json();
            if (sid === currentSessionId) showWorkflow(data);
        }
        async function resumeApproval(approved) {
            if (streaming || !pendingWorkflow) return;
            const sid = currentSessionId, pause = pendingWorkflow;
            const controller = new AbortController();
            sessionStreams.set(sid, {controller}); updateSendBtn(); loadConversations();
            const panel = document.getElementById('workflow-panel');
            panel.querySelectorAll('button').forEach(b => b.disabled = true);
            try {
                const resp = await fetch(`/api/conversations/${encodeURIComponent(sid)}/resume`, {
                    method:'POST', headers:{Authorization:AUTH_TOKEN,'Content-Type':'application/json'},
                    body:JSON.stringify({id:pause.id,value:approved}), signal:controller.signal});
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || '审批处理失败');
                {
                    const msg = appendMessage('assistant', data.answer, sid);
                    msg.bubble.innerHTML = renderMarkdown(data.answer);
                    showSessionWorkflow(sid, data);
                }
            } catch (error) { showToast(error.message, true); }
            finally { sessionStreams.delete(sid); updateSendBtn(); if (sid === currentSessionId) panel.querySelectorAll('button').forEach(b => b.disabled = false); loadConversations(); }
        }
        async function downloadArtifact(id) {
            try {
                const resp = await fetch(`/api/conversations/${encodeURIComponent(currentSessionId)}/artifacts/${encodeURIComponent(id)}`, {headers:{Authorization:AUTH_TOKEN}});
                if (!resp.ok) { const error = await resp.json(); throw new Error(error.detail || '下载失败'); }
                const url = URL.createObjectURL(await resp.blob());
                const a = document.createElement('a'); a.href = url; a.download = 'filing-draft.json'; a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (error) { showToast(error.message, true); }
        }

        // ---------- 主题 ----------
        function initTheme() {
            const t = localStorage.getItem('tax_agent_theme') || 'light';
            document.documentElement.dataset.theme = t;
            document.getElementById('theme-btn').textContent = t === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const cur = document.documentElement.dataset.theme;
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            localStorage.setItem('tax_agent_theme', next);
            document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
        }

        // ---------- 侧边栏 ----------
        function toggleSidebar(force) {
            const sb = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const next = force !== undefined ? force : sb.classList.contains('collapsed');
            sb.classList.toggle('collapsed', !next);
            backdrop.classList.toggle('show', next);
        }

        // ---------- 提示 ----------
        function showToast(msg, isError) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        // ---------- 欢迎页推荐 ----------
        const SUGGESTIONS = ['什么是增值税？', '小规模纳税人增值税税率是多少？', '小型微利企业有什么企业所得税优惠？', '餐饮发票能开专票抵扣吗？'];
        function renderSuggestions() {
            const grid = document.getElementById('suggestion-grid');
            grid.innerHTML = SUGGESTIONS.map(q =>
                `<button class="suggestion-card" onclick="askSuggestion(this.textContent)">${q}</button>`
            ).join('');
        }
        function askSuggestion(q) {
            userInput.value = q;
            sendMessage();
        }

        // ---------- 自动滚动 ----------
        chat.addEventListener('scroll', () => {
            const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
            autoScroll = nearBottom;
            document.getElementById('back-to-bottom').style.display = nearBottom ? 'none' : 'block';
        });
        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
            document.getElementById('back-to-bottom').style.display = 'none';
            autoScroll = true;
        }

        // ---------- 输入框自适应 ----------
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
        });
        userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        // ---------- 消息渲染 ----------
        function appendMessage(role, text, sessionId = currentSessionId) {
            const welcome = sessionId === currentSessionId ? document.getElementById('welcome') : null;
            if (welcome) welcome.remove();
            const wrap = document.createElement('div');
            wrap.className = 'message ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (role === 'user') {
                bubble.textContent = text;
            } else {
                bubble.textContent = text || '';
            }
            wrap.appendChild(bubble);
            if (sessionId === currentSessionId) {
                chatInner.appendChild(wrap);
                if (autoScroll) scrollToBottom();
            } else if (conversationViews.has(sessionId)) conversationViews.get(sessionId).nodes.push(wrap);
            return { wrap, bubble };
        }

        // 消息操作按钮：底部独立一行，小符号，不挤占气泡
        function addMessageActions(wrap, role, text) {
            if (!wrap || wrap.querySelector('.msg-actions')) return;
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            if (text && text.trim()) {
                actions.appendChild(makeActionBtn('复制', () => copyText(text)));
            }
            if (role === 'user') {
                if (text && text.trim()) {
                    actions.appendChild(makeActionBtn('修改', () => { userInput.value = text; userInput.focus(); userInput.dispatchEvent(new Event('input')); }));
                }
                actions.appendChild(makeActionBtn('撤回', () => retractMessage(wrap)));
            } else {
                if (lastUserQuery()) {
                    actions.appendChild(makeActionBtn('重新生成', () => regenerate(wrap)));
                }
            }
            if (actions.children.length > 0) {
                wrap.appendChild(actions);
            }
        }
        function makeActionBtn(label, onClick) {
            const b = document.createElement('button');
            b.textContent = label;
            b.onclick = onClick;
            return b;
        }
        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast('已复制')).catch(() => fallbackCopy(text));
            } else { fallbackCopy(text); }
        }
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta); showToast('已复制');
        }
        async function retractMessage(userWrap) {
            try {
                const response = await fetch(`/api/conversations/${currentSessionId}/messages/last`, {
                    method: 'DELETE',
                    headers: { 'Authorization': AUTH_TOKEN },
                });
                if (!response.ok) { const error = await response.json(); throw new Error(error.detail || '撤回失败'); }
            } catch (e) { /* 后端确认成功后才移除 DOM */ showToast(e.message || '撤回失败', true); return; }
            let next = userWrap.nextElementSibling;
            while (next && next.classList && next.classList.contains('message')) {
                const after = next.nextElementSibling;
                if (next.classList.contains('assistant')) { next.remove(); break; }
                next = after;
            }
            userWrap.remove();
        }
        function regenerate(assistantWrap) {
            const q = lastUserQuery();
            if (!q) { showToast('没有可重新生成的问题', true); return; }
            assistantWrap.remove();
            userInput.value = q;
            sendMessage();
        }
        function lastUserQuery() {
            const bubbles = chatInner.querySelectorAll('.message.user .bubble');
            return bubbles.length ? bubbles[bubbles.length - 1].textContent : '';
        }

        // ---------- markdown 渲染 ----------
        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function renderInline(text) {
            let lines = text.split('\n');
            let out = [];
            let inList = null;
            for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
                const line = lines[lineIndex];
                const trimmed = line.trim();
                if (/^\|/.test(trimmed) && /^\|\s*:?-{3,}/.test((lines[lineIndex + 1] || '').trim())) {
                    if (inList) { out.push(inList === 'ul' ? '</ul>' : '</ol>'); inList = null; }
                    const cells = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim());
                    const headers = cells(line);
                    out.push('<table><thead><tr>' + headers.map(s => '<th>' + inlineMarkup(s) + '</th>').join('') + '</tr></thead><tbody>');
                    lineIndex++; // 已解析的分隔行不作为正文。
                    while (lineIndex + 1 < lines.length && /^\|/.test(lines[lineIndex + 1].trim())) {
                        const row = cells(lines[++lineIndex]);
                        out.push('<tr>' + headers.map((_, i) => '<td>' + inlineMarkup(row[i] || '') + '</td>').join('') + '</tr>');
                    }
                    out.push('</tbody></table>');
                    continue;
                }
                if (/^```/.test(trimmed)) { out.push(''); continue; }
                if (/^###\s+/.test(trimmed)) { out.push('<h3>' + inlineMarkup(trimmed.replace(/^###\s+/, '')) + '</h3>'); continue; }
                if (/^##\s+/.test(trimmed)) { out.push('<h2>' + inlineMarkup(trimmed.replace(/^##\s+/, '')) + '</h2>'); continue; }
                if (/^#\s+/.test(trimmed)) { out.push('<h1>' + inlineMarkup(trimmed.replace(/^#\s+/, '')) + '</h1>'); continue; }
                if (/^[-*]\s+/.test(trimmed)) {
                    if (inList !== 'ul') { out.push('<ul>'); inList = 'ul'; }
                    out.push('<li>' + inlineMarkup(trimmed.replace(/^[-*]\s+/, '')) + '</li>');
                    continue;
                }
                if (/^\d+\.\s+/.test(trimmed)) {
                    if (inList !== 'ol') { out.push('<ol>'); inList = 'ol'; }
                    out.push('<li>' + inlineMarkup(trimmed.replace(/^\d+\.\s+/, '')) + '</li>');
                    continue;
                }
                if (inList) { out.push(inList === 'ul' ? '</ul>' : '</ol>'); inList = null; }
                if (/^\|/.test(trimmed)) { out.push('<p>' + inlineMarkup(line) + '</p>'); continue; }
                if (trimmed === '') { out.push(''); continue; }
                out.push('<p>' + inlineMarkup(line) + '</p>');
            }
            if (inList) out.push(inList === 'ul' ? '</ul>' : '</ol>');
            return out.join('\n');
        }
        function inlineMarkup(s) {
            s = escapeHtml(s);
            s = s.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            return s;
        }
        function renderMarkdown(text) {
            if (!text) return '';
            const parts = text.split('```');
            let out = '';
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 1) {
                    let code = parts[i];
                    let lang = '';
                    const nl = code.indexOf('\n');
                    if (nl !== -1) { lang = code.slice(0, nl).trim(); code = code.slice(nl + 1); }
                    out += `<div class="code-block"><div class="code-header"><span>${escapeHtml(lang || 'code')}</span><button class="code-copy">复制</button></div><pre><code>${escapeHtml(code)}</code></pre></div>`;
                } else {
                    out += renderInline(parts[i]);
                }
            }
            return out;
        }

        // 代码块复制（事件委托）
        chatInner.addEventListener('click', e => {
            if (e.target.classList && e.target.classList.contains('code-copy')) {
                const code = e.target.closest('.code-block').querySelector('code').textContent;
                copyText(code);
            }
        });

        // ---------- 联网检索 ----------
        function updateSourceTypes() {
            const webChecked = document.getElementById('chk-web')?.checked || false;
            selectedSourceTypes = ['default', 'user_upload'];
            if (webChecked) selectedSourceTypes.push('web_search');
        }

        // ---------- 发送 ----------
        async function sendMessage() {
            if (streaming) { abortController && abortController.abort(); return; }
            if (conversationViews.get(currentSessionId)?.loading) { showToast('正在加载本对话历史，请稍候'); return; }
            if (pendingWorkflow?.kind === 'approval') { showToast('请先批准或拒绝待审批操作', true); return; }
            if (pendingWorkflow) showWorkflow({});
            const text = userInput.value.trim();
            if (!text) return;
            const sid = currentSessionId;
            const requestToken = AUTH_TOKEN;
            const activeFiles = pendingFiles.filter(Boolean);
            if (activeFiles.some(f => f.status === 'uploading')) { showToast('文件上传中，请稍候…', true); return; }
            const readyFiles = activeFiles.filter(f => f.status === 'done' && f.fileId);
            userInput.value = '';
            userInput.style.height = 'auto';

            const displayText = readyFiles.length
                ? text + '\n\n📎 ' + readyFiles.map(f => f.file.name).join(', ')
                : text;
            const userMsg = appendMessage('user', displayText);
            addMessageActions(userMsg.wrap, 'user', displayText);

            pendingFiles.length = 0;
            document.getElementById('upload-preview').innerHTML = '';
            sendBtn.disabled = false;
            sendBtn.title = '';

            const assistantMsg = appendMessage('assistant', '');
            assistantMsg.bubble.classList.add('typing-cursor');
            let answerText = '';
            let thinkText = '';
            let thinkPanel = null;

            const controller = new AbortController();
            sessionStreams.set(sid, {controller, title:text.slice(0,20)});
            updateSendBtn(); loadConversations();

            try {
                // 本轮联网直接由后端编排器处理，避免向量入库失败导致搜索失效。

                const resp = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': requestToken },
                    body: JSON.stringify({ user_id: 'web_user', query: text, session_id: sid, source_types: selectedSourceTypes, web_search: document.getElementById('chk-web').checked, uploaded_file_ids: readyFiles.map(f => f.fileId) }),
                    signal: controller.signal,
                });
                loadConversations();
                if (!resp.ok) { const error = await resp.json(); throw new Error(error.detail || `HTTP ${resp.status}`); }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const events = buffer.split('\n\n');
                    buffer = events.pop();
                    for (const raw of events) {
                        if (!raw.trim()) continue;
                        let type = 'message', dataStr = '';
                        for (const line of raw.split('\n')) {
                            if (line.startsWith('event:')) type = line.slice(6).trim();
                            else if (line.startsWith('data:')) dataStr = line.slice(5).trim();
                        }
                        if (type === 'status') {
                            if (!answerText) assistantMsg.bubble.textContent = JSON.parse(dataStr).text || '处理中…';
                        } else if (type === 'token' || type === 'answer') {
                            try {
                                const p = JSON.parse(dataStr);
                                answerText = type === 'answer' ? (p.text || '') : answerText + (p.text || '');
                                assistantMsg.bubble.textContent = answerText;
                            } catch (e) { throw new Error('回复数据格式错误，请重试'); }
                            if (sid === currentSessionId && autoScroll) scrollToBottom();
                        } else if (type === 'thought') {
                            try { thinkText += JSON.parse(dataStr); } catch (e) { thinkText += dataStr; }
                            if (!thinkPanel) thinkPanel = addThinkPanel(assistantMsg.wrap);
                            thinkPanel.querySelector('.think-body').textContent = thinkText;
                            if (sid === currentSessionId && autoScroll) scrollToBottom();
                        } else if (type === 'interrupt') {
                            showSessionWorkflow(sid, {pending:JSON.parse(dataStr)});
                        } else if (type === 'error') {
                            let error = dataStr;
                            try { const payload = JSON.parse(dataStr); error = payload.msg || payload; } catch (e) {}
                            answerText += '\n\n⚠️ ' + error;
                        } else if (type === 'done') {
                            // 流式结束
                        }
                    }
                }

                assistantMsg.bubble.classList.remove('typing-cursor');
                assistantMsg.bubble.innerHTML = renderMarkdown(answerText) || '（未返回内容）';
                addMessageActions(assistantMsg.wrap, 'assistant', answerText);

            } catch (err) {
                assistantMsg.bubble.classList.remove('typing-cursor');
                if (err.name !== 'AbortError') {
                    assistantMsg.bubble.textContent = '请求失败：' + err.message;
                } else {
                    assistantMsg.bubble.textContent = (answerText || '') + ' （已停止）';
                }
                addMessageActions(assistantMsg.wrap, 'assistant', answerText);
            } finally {
                sessionStreams.delete(sid);
                updateSendBtn();
                if (sid === currentSessionId) userInput.focus();
                loadConversations();
                if (sid === currentSessionId) refreshWorkflow().catch(error => showToast(error.message, true));
            }
        }

        function addThinkPanel(wrap) {
            const panel = document.createElement('div');
            panel.className = 'think-panel';
            panel.innerHTML = `<button class="think-toggle" onclick="this.nextElementSibling.classList.toggle('open')">🧠 深度思考</button><div class="think-body"></div>`;
            wrap.appendChild(panel);
            return panel;
        }

        // ---------- 会话列表 ----------
        function groupLabel(iso) {
            if (!iso) return '更早';
            const d = new Date(iso);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today.getTime() - 86400000);
            if (d >= today) return '今天';
            if (d >= yesterday) return '昨天';
            return '更早';
        }
        async function loadConversations() {
            try {
                const requestToken = AUTH_TOKEN;
                const resp = await fetch('/api/conversations', { headers: { 'Authorization': requestToken } });
                const data = await resp.json();
                if (requestToken !== AUTH_TOKEN) return;
                if (!resp.ok) throw new Error(data.detail || '会话列表加载失败');
                const convs = (data.conversations || []).slice().sort((a, b) => (b.updated_at || '') > (a.updated_at || '') ? 1 : -1);
                for (const [sid, run] of sessionStreams) {
                    if (!convs.some(c => c.session_id === sid)) convs.unshift({session_id:sid,title:run.title || '审批处理中',updated_at:new Date().toISOString()});
                }
                const list = document.getElementById('conv-list');
                let html = '';
                let lastGroup = '';
                for (const c of convs) {
                    const g = groupLabel(c.updated_at);

        // ---------- 文件上传 ----------
        let pendingFiles = [];
        function fmtSize(bytes) {
            if (!bytes) return '0 B';
            const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
            while (bytes >= 1024 && i < u.length - 1) { bytes /= 1024; i++; }
            return bytes.toFixed(i === 0 ? 0 : 1) + ' ' + u[i];
        }
        function isImage(name) { return /\.(png|jpg|jpeg|gif|webp|bmp)$/i.test(name); }
        function fileTypeIcon(name) {
            const ext = (name.split('.').pop() || '').toLowerCase();
            const map = { pdf: 'PDF', docx: 'DOC', xlsx: 'XLS', pptx: 'PPT', csv: 'CSV', txt: 'TXT', md: 'MD' };
            return map[ext] || ext.toUpperCase().slice(0, 3);
        }
        function createUploadCard(file, idx, sessionId = currentSessionId) {
            const card = document.createElement('div');
            card.className = 'upload-card'; card.id = 'upload-card-' + idx;
            const isImg = isImage(file.name);
            if (isImg) {
                const thumb = document.createElement('img');
                thumb.className = 'upload-thumb';
                thumb.src = URL.createObjectURL(file);
                card.appendChild(thumb);
            } else {
                const icon = document.createElement('div');
                icon.className = 'upload-file-icon';
                icon.textContent = fileTypeIcon(file.name);
                card.appendChild(icon);
            }
            const info = document.createElement('div'); info.className = 'upload-info';
            const nameEl = document.createElement('div'); nameEl.className = 'upload-filename'; nameEl.textContent = file.name;
            info.appendChild(nameEl);
            const meta = document.createElement('div'); meta.className = 'upload-meta'; meta.textContent = fmtSize(file.size);
            info.appendChild(meta);
            const progress = document.createElement('div'); progress.className = 'upload-progress';
            const fill = document.createElement('div'); fill.className = 'upload-progress-fill'; fill.style.width = '0%';
            progress.appendChild(fill); info.appendChild(progress);
            card.appendChild(info);
            const rm = document.createElement('button'); rm.className = 'upload-remove'; rm.textContent = '×';
            rm.onclick = () => removeUploadCard(idx, sessionId);
            card.appendChild(rm);
            if (sessionId === currentSessionId) document.getElementById('upload-preview').appendChild(card);
            else if (conversationViews.has(sessionId)) conversationViews.get(sessionId).uploadNodes.push(card);
            return { card, fill, meta };
        }
        function removeUploadCard(idx, sessionId = currentSessionId) {
            const entries = sessionId === currentSessionId ? pendingFiles : conversationViews.get(sessionId)?.files;
            if (!entries) return;
            const entry = entries[idx];
            if (entry && entry.xhr) entry.xhr.abort();
            if (entry && entry.objectUrl) URL.revokeObjectURL(entry.objectUrl);
            delete entries[idx];
            const card = entry?.card;
            if (card) card.remove();
            const view = conversationViews.get(sessionId);
            if (view) view.uploadNodes = (view.uploadNodes || []).filter(node => node !== card);
            updateSendBtn();
        }
        function updateSendBtn() {
            const run = sessionStreams.get(currentSessionId);
            streaming = !!run; abortController = run?.controller || null;
            sendBtn.textContent = run ? '■' : '➤'; sendBtn.classList.toggle('stop', !!run);
            const active = pendingFiles.filter(Boolean);
            const uploading = active.some(f => f.status === 'uploading');
            sendBtn.disabled = !run && (uploading || !!conversationViews.get(currentSessionId)?.loading);
            sendBtn.title = uploading ? '文件上传中，请稍候…' : '';
        }
        async function handleFiles(files) {
            const sid = currentSessionId, requestToken = AUTH_TOKEN, uploadEntries = pendingFiles;
            const scope = document.getElementById('upload-scope').value;
            if (scope === 'session') {
                try {
                    const r = await fetch('/api/conversations', { method: 'POST', headers: { 'Authorization': requestToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sid }) });
                    if (!r.ok) { const e = await r.json(); throw new Error(e.detail || '创建对话失败'); }
                    loadConversations();
                } catch (e) { showToast(e.message, true); return; }
            }
            for (const f of files) {
                const idx = uploadEntries.length;
                const entry = { file: f, status: 'uploading', fileId: null, xhr: null, objectUrl: null };
                uploadEntries[idx] = entry;
                const { card, fill, meta } = createUploadCard(f, idx, sid);
                entry.card = card;
                updateSendBtn();
                if (isImage(f.name)) {
                    entry.objectUrl = card.querySelector('img').src;
                }
                try {
                    const fd = new FormData();
                    fd.append('file', f); fd.append('scope', scope);
                    if (scope === 'session') fd.append('session_id', sid);
                    await new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        entry.xhr = xhr;
                        xhr.upload.onprogress = e => {
                            if (e.lengthComputable) {
                                const pct = Math.round(e.loaded / e.total * 100);
                                fill.style.width = pct + '%';
                                meta.textContent = fmtSize(f.size) + ' — ' + pct + '%';
                            }
                        };
                        xhr.onload = () => {
                            try {
                                const data = JSON.parse(xhr.responseText);
                                if (data.status === 'success') {
                                    entry.status = 'done';
                                    entry.fileId = data.file_id;
                                    fill.style.width = '100%'; fill.classList.add('done');
                                    meta.textContent = fmtSize(f.size) + ' ✓ 已就绪';
                                } else {
                                    throw new Error(data.detail || data.message || '上传未完成');
                                }
                            } catch (err) { reject(err); }
                            resolve();
                        };
                        xhr.onerror = () => reject(new Error('网络错误'));
                        xhr.onabort = () => reject(new Error('上传已取消'));
                        xhr.ontimeout = () => reject(new Error('上传超时'));
                        xhr.open('POST', '/api/knowledge/upload');
                        xhr.setRequestHeader('Authorization', requestToken);
                        xhr.timeout = 120000;
                        xhr.send(fd);
                    });
                } catch (e) {
                    entry.status = 'error';
                    card.classList.add('error');
                    fill.style.width = '100%'; fill.classList.add('error');
                    meta.textContent = fmtSize(f.size) + ' — ' + e.message;
                    const retry = document.createElement('div'); retry.className = 'upload-retry';
                    retry.textContent = '重试';
                    retry.onclick = () => {
                        card.querySelector('.upload-retry')?.remove();
                        card.classList.remove('error'); fill.classList.remove('error');
                        removeUploadCard(idx, sid);
                        fill.style.width = '0%'; meta.textContent = fmtSize(f.size);
                        handleFiles([f]).catch(error => showToast(error.message, true));
                    };
                    card.querySelector('.upload-info').appendChild(retry);
                }
                updateSendBtn();
            }
        }
        const composer = document.getElementById('composer');
        composer.addEventListener('dragover', e => { e.preventDefault(); });
        composer.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

        async function loadModels() {

                    const opt = document.createElement('option'); opt.value = data.config.llm.model;
                    opt.textContent = data.config.llm.model; opt.selected = true; sel.appendChild(opt);

        async function probeModels(prefix, button) {
            const status = document.getElementById('cfg-' + prefix + '-status');
            const url = document.getElementById('cfg-' + prefix + '-url').value.trim();
            button.disabled = true; status.textContent = '检测中…'; status.style.color = 'var(--text-dim)';
            try {
                const response = await fetch('/api/settings/models', {method:'POST', headers:{Authorization:AUTH_TOKEN,'Content-Type':'application/json'},
                    body:JSON.stringify({section:prefix === 'llm' ? 'llm' : 'embedding', base_url:url, api_key:document.getElementById('cfg-' + prefix + '-key').value.trim()})});
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error('❌ 无法连接，请检查配置');
                if (url !== document.getElementById('cfg-' + prefix + '-url').value.trim()) return;
                discoveredModels[url] = data.models;
                const list = document.getElementById(prefix === 'llm' ? 'llm-models' : 'emb-models');
                list.replaceChildren();
                for (const id of data.models) { const option = document.createElement('option'); option.value = id; list.appendChild(option); }
                status.textContent = '✅ 连接成功，已获取 ' + data.models.length + ' 个模型'; status.style.color = '#22a060';
            } catch (error) { status.textContent = '❌ 无法连接，请检查配置'; status.style.color = '#dc3545'; }

        async function refreshQdrant(button) {
            const status = document.getElementById('cfg-qdrant-status');
            if (button) button.disabled = true;
            status.textContent = '查询中…'; status.style.color = 'var(--text-dim)';
            try {
                const response = await fetch('/api/settings/qdrant', {headers:{Authorization:AUTH_TOKEN}});
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.message || data.detail || '查询失败');
                status.textContent = '集合：' + data.collection + ' | 状态：' + data.status + ' | 向量总数：' + data.vector_count + ' | 预估正文空间：' + fmtSize(data.estimated_bytes);
                if (data.vector_limit) status.textContent += ' | 预警上限：' + data.vector_limit + '（' + (data.usage_ratio * 100).toFixed(1) + '%）';
                else if (data.reference_ram_bytes) status.textContent += '\n免费档 1 GiB RAM 参考：估算 ' + fmtSize(data.estimated_ram_bytes) + '（' + (data.usage_ratio * 100).toFixed(1) + '%，向量正文 × 1.5；不含 payload、其他集合，不是实际用量或配额）';
                if (data.warning) status.textContent += '\n⚠️ 向量数接近上限，建议清理或升级';
                status.style.color = data.warning ? '#e6a23c' : '#22a060';
            } catch (error) { status.textContent = error.message; status.style.color = '#dc3545'; }
            finally { if (button) button.disabled = false; }
        }

        function switchRole(role) {
            if (role === currentRole) {

            if (sessionStreams.size) { showToast('请先停止正在回复的对话，再切换身份', true); return; }
            currentRole = role;
            sessionStorage.setItem('tax_agent_role', role);
            AUTH_TOKEN = getAuthToken();
            for (const view of conversationViews.values()) for (const entry of view.files || []) entry?.xhr?.abort();

        refreshWorkflow().catch(error => showToast(error.message, true));
        toggleSidebar(window.innerWidth > 768);

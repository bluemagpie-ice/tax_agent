<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TaxAgent · 智能税务助手</title>
    <style>
        :root {
            --primary: #4d6bfe;
            --primary-soft: #eef0ff;
            --bg: #ffffff;
            --bg-sidebar: #f7f7f8;
            --bg-chat: #ffffff;
            --text: #1a1a1a;
            --text-dim: #8a8a8a;
            --border: #e5e5e5;
            --bubble-user: #eef0ff;
            --hover: #ececec;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
        }
        [data-theme="dark"] {
            --primary: #4d6bfe;
            --primary-soft: #2a2f4a;
            --bg: #1a1a1a;
            --bg-sidebar: #212121;
            --bg-chat: #1a1a1a;
            --text: #ececec;
            --text-dim: #9a9a9a;
            --border: #333;
            --bubble-user: #2a2f4a;
            --hover: #2a2a2a;
            --code-bg: #111;
            --code-text: #d4d4d4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            overflow: hidden;
            font-size: 15px;
            line-height: 1.6;
        }
        .app { display: flex; height: 100%; }

        /* ---------- 侧边栏 ---------- */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: margin-left .2s ease;
        }
        .sidebar.collapsed { margin-left: -260px; }
        .sidebar-header { padding: 12px; }
        .new-chat-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .new-chat-btn:hover { filter: brightness(1.05); }
        .conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
        .conv-group-label { font-size: 12px; color: var(--text-dim); padding: 12px 8px 4px; }
        .conv-item {
            position: relative;
            display: flex;
            align-items: center;
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item:hover { background: var(--hover); }
        .conv-item.active { background: var(--primary-soft); }
        .conv-item .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .conv-item .conv-actions { display: none; gap: 2px; }
        .conv-item:hover .conv-actions { display: flex; }
        .conv-item .conv-actions button {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-dim); font-size: 13px; padding: 2px 4px; border-radius: 4px;
        }
        .conv-item .conv-actions button:hover { background: var(--border); color: var(--text); }
        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .icon-btn {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-dim); font-size: 16px; padding: 8px; border-radius: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .icon-btn:hover { background: var(--hover); color: var(--text); }
        .sidebar-footer .spacer { flex: 1; }

        /* ---------- 主区域 ---------- */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-header {
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
        }
        .main-title { flex: 1; text-align: center; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .model-select {
            padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer;
        }

        /* ---------- 聊天区 ---------- */
        .chat { flex: 1; overflow-y: auto; padding: 24px 16px; scroll-behavior: auto; }
        .chat-inner { max-width: 820px; margin: 0 auto; }
        .welcome { max-width: 820px; margin: 60px auto 0; text-align: center; }
        .welcome h2 { font-size: 26px; margin-bottom: 8px; }
        .welcome p { color: var(--text-dim); margin-bottom: 28px; }
        .suggestion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 560px; margin: 0 auto; }
        .suggestion-card {
            padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
            cursor: pointer; text-align: left; font-size: 14px; color: var(--text);
            background: var(--bg);
        }
        .suggestion-card:hover { border-color: var(--primary); background: var(--primary-soft); }

        .message { display: flex; margin-bottom: 20px; }
        .message.user { justify-content: flex-end; }
        .message .bubble {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.6;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .message.user .bubble { background: var(--bubble-user); border-bottom-right-radius: 4px; }
        .message.assistant .bubble { background: transparent; padding-left: 0; padding-right: 0; width: 100%; max-width: 100%; }

        /* 消息操作按钮：位于消息底部独立一行，小符号，不挤占气泡 */
        .msg-actions {
            display: flex;
            gap: 2px;
            margin-top: 2px;
            opacity: 0;
            transition: opacity .15s;
        }
        .message:hover .msg-actions { opacity: 1; }
        .message.user .msg-actions { justify-content: flex-end; }
        .message.assistant .msg-actions { justify-content: flex-start; padding-left: 0; }
        .msg-actions button {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-dim); font-size: 11px; padding: 3px 7px; border-radius: 5px;
        }
        .msg-actions button:hover { background: var(--hover); color: var(--text); }

        /* ---------- markdown 元素 ---------- */
        .bubble p { margin: 6px 0; }
        .bubble h1, .bubble h2, .bubble h3 { margin: 14px 0 6px; font-weight: 600; }
        .bubble h1 { font-size: 20px; } .bubble h2 { font-size: 17px; } .bubble h3 { font-size: 15px; }
        .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
        .bubble li { margin: 3px 0; }
        .bubble code.inline {
            background: var(--hover); padding: 1px 5px; border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace; font-size: 13px;
        }
        .bubble table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 14px; }
        .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
        .bubble th { background: var(--bg-sidebar); font-weight: 600; }
        .bubble blockquote { border-left: 3px solid var(--primary); padding-left: 12px; color: var(--text-dim); margin: 8px 0; }
        .code-block { margin: 10px 0; border-radius: 10px; overflow: hidden; background: var(--code-bg); }
        .code-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 12px; background: rgba(255,255,255,.06); color: #aaa; font-size: 12px;
        }
        .code-copy { background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
        .code-copy:hover { color: #fff; background: rgba(255,255,255,.1); }
        .code-block pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
        .code-block code { color: var(--code-text); font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.5; }
        .think-panel { border: 1px solid var(--border); border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .think-toggle { width: 100%; text-align: left; padding: 8px 14px; background: var(--bg-sidebar); border: none; cursor: pointer; color: var(--text-dim); font-size: 13px; }
        .think-body { padding: 10px 14px; color: var(--text-dim); font-size: 13px; white-space: pre-wrap; display: none; border-top: 1px solid var(--border); }
        .think-body.open { display: block; }

        /* ---------- 输入区 ---------- */
        .composer { flex-shrink: 0; padding: 12px 16px 16px; }
        .composer-inner { max-width: 820px; margin: 0 auto; position: relative; }
        .composer-box {
            display: flex; align-items: flex-end; gap: 8px;
            border: 1px solid var(--border); border-radius: 16px;
            padding: 8px 10px; background: var(--bg);
        }
        .composer-box:focus-within { border-color: var(--primary); }
        .attach-btn { background: transparent; border: none; cursor: pointer; color: var(--text-dim); font-size: 18px; padding: 4px; }
        .attach-btn:hover { color: var(--text); }
        .composer textarea {
            flex: 1; border: none; outline: none; resize: none; background: transparent;
            color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.5;
            max-height: 200px; padding: 6px 4px;
        }
        .send-btn {
            background: var(--primary); color: #fff; border: none; cursor: pointer;
            width: 34px; height: 34px; border-radius: 50%; font-size: 16px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .send-btn.stop { background: #e5484d; border-radius: 8px; font-size: 14px; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        .composer-hint { text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 6px; }
        .source-filter { display: flex; gap: 14px; justify-content: center; margin-top: 6px; font-size: 12px; color: var(--text-dim); }
        .source-filter label { cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .source-filter input { accent-color: var(--primary); }
        .back-to-bottom {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
            padding: 6px 14px; cursor: pointer; color: var(--text); font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08); display: none; z-index: 10;
        }
        .typing-cursor::after { content: '▍'; animation: blink .8s infinite; color: var(--primary); }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #323232; color: #fff; padding: 8px 20px; border-radius: 8px;
            font-size: 13px; z-index: 2000; display: none;
        }
        .toast.error { background: #e5484d; }

        /* 设置弹窗 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--bg); border-radius: 14px; padding: 24px; width: 480px; max-height: 82vh; overflow-y: auto; color: var(--text); }
        .modal h3 { font-size: 17px; margin-bottom: 16px; }
        .modal .section-title { font-size: 14px; font-weight: 600; margin: 14px 0 8px; }
        .modal label { display: block; font-size: 13px; color: var(--text-dim); margin: 8px 0 4px; }
        .modal input, .modal select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--bg); color: var(--text); margin-bottom: 4px; }
        .modal .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
        .modal .btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; }
        .modal .btn-primary { background: var(--primary); color: #fff; }
        .modal .btn-cancel { background: var(--hover); color: var(--text); }

        /* 移动端：侧边栏变抽屉 */
        .sidebar-backdrop { display: none; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 500; margin-left: 0; }
            .sidebar.collapsed { margin-left: -260px; }
            .sidebar-backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 400; }
            .composer { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
            .suggestion-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="newConversation()">
                    <span>+</span> 新对话
                </button>
            </div>
            <div class="conv-list" id="conv-list"></div>
            <div class="sidebar-footer">
                <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
                <button class="icon-btn" id="settings-btn" onclick="showSettings()" title="模型配置">⚙</button>
                <span class="spacer"></span>
                <span style="font-size:12px;color:var(--text-dim)" id="me-label"></span>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

        <!-- 主区域 -->
        <main class="main">
            <header class="main-header">
                <button class="icon-btn" onclick="toggleSidebar()" title="折叠侧边栏">☰</button>
                <div class="main-title" id="main-title">税务智能助手</div>
                <select class="model-select" id="model-select" onchange="onModelChange()"></select>
            </header>

            <div class="chat" id="chat">
                <div class="chat-inner" id="chat-inner">
                    <div class="welcome" id="welcome">
                        <h2>你好，我是税务助手</h2>
                        <p>我可以帮你解答发票合规、增值税、企业所得税、个人所得税等问题</p>
                        <div class="suggestion-grid" id="suggestion-grid"></div>
                    </div>
                </div>
            </div>
            <button class="back-to-bottom" id="back-to-bottom" onclick="scrollToBottom()">↓ 回到底部</button>

            <div class="composer" id="composer">
                <div class="composer-inner">
                    <div class="composer-box" id="composer-box">
                        <button class="attach-btn" id="attach-btn" onclick="document.getElementById('file-input').click()" title="上传文件">📎</button>
                        <textarea id="user-input" rows="1" placeholder="输入你的税务问题…（Enter 发送，Shift+Enter 换行）"></textarea>
                        <input type="file" id="file-input" multiple hidden onchange="handleFiles(this.files)">
                        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
                    </div>
                    <div class="source-filter">
                        <label><input type="checkbox" id="chk-web" onchange="updateSourceTypes()"> 联网检索最新政策</label>
                    </div>
                    <div class="composer-hint">内容由 AI 生成，仅供参考，请以当地税务机关为准</div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h3>⚙ 模型配置</h3>
            <div class="section-title">LLM 对话模型</div>
            <label>模型</label><select id="cfg-llm-model"></select>
            <label>API Key</label><input id="cfg-llm-key" type="password" placeholder="留空则不修改" autocomplete="off">
            <label>Base URL</label><input id="cfg-llm-url" type="text" placeholder="https://open.bigmodel.cn/api/paas/v4/">
            <div class="section-title">Embedding 向量模型</div>
            <label>模型</label><select id="cfg-emb-model"></select>
            <label>API Key</label><input id="cfg-emb-key" type="password" placeholder="留空则不修改" autocomplete="off">
            <label>Base URL</label><input id="cfg-emb-url" type="text" placeholder="https://api.siliconflow.cn/v1">
            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeSettings()">取消</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        const AUTH_TOKEN = 'Bearer test_token_123';
        const chat = document.getElementById('chat');
        const chatInner = document.getElementById('chat-inner');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let currentSessionId = localStorage.getItem('tax_agent_session_id') || 'session_' + Date.now();
        let selectedSourceTypes = ['default', 'user_upload'];
        let abortController = null;
        let autoScroll = true;
        let streaming = false;

        // ---------- 主题 ----------
        function initTheme() {
            const t = localStorage.getItem('tax_agent_theme') || 'light';
            document.documentElement.dataset.theme = t;
            document.getElementById('theme-btn').textContent = t === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const cur = document.documentElement.dataset.theme;
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            localStorage.setItem('tax_agent_theme', next);
            document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
        }

        // ---------- 侧边栏 ----------
        function toggleSidebar(force) {
            const sb = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const next = force !== undefined ? force : sb.classList.contains('collapsed');
            sb.classList.toggle('collapsed', !next);
            backdrop.classList.toggle('show', next);
        }

        // ---------- 提示 ----------
        function showToast(msg, isError) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (isError ? ' error' : '');
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        // ---------- 欢迎页推荐 ----------
        const SUGGESTIONS = ['什么是增值税？', '小规模纳税人增值税税率是多少？', '小型微利企业有什么企业所得税优惠？', '餐饮发票能开专票抵扣吗？'];
        function renderSuggestions() {
            const grid = document.getElementById('suggestion-grid');
            grid.innerHTML = SUGGESTIONS.map(q =>
                `<button class="suggestion-card" onclick="askSuggestion(this.textContent)">${q}</button>`
            ).join('');
        }
        function askSuggestion(q) {
            userInput.value = q;
            sendMessage();
        }

        // ---------- 自动滚动 ----------
        chat.addEventListener('scroll', () => {
            const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
            autoScroll = nearBottom;
            document.getElementById('back-to-bottom').style.display = nearBottom ? 'none' : 'block';
        });
        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
            document.getElementById('back-to-bottom').style.display = 'none';
            autoScroll = true;
        }

        // ---------- 输入框自适应 ----------
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
        });
        userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        // ---------- 消息渲染 ----------
        function appendMessage(role, text) {
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();
            const wrap = document.createElement('div');
            wrap.className = 'message ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (role === 'user') {
                bubble.textContent = text;
            } else {
                bubble.textContent = text || '';
            }
            wrap.appendChild(bubble);
            chatInner.appendChild(wrap);
            if (autoScroll) scrollToBottom();
            return { wrap, bubble };
        }

        // 消息操作按钮：底部独立一行，小符号，不挤占气泡
        function addMessageActions(wrap, role, text) {
            if (!wrap || wrap.querySelector('.msg-actions')) return;
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            actions.appendChild(makeActionBtn('复制', () => copyText(text)));
            if (role === 'user') {
                actions.appendChild(makeActionBtn('修改', () => { userInput.value = text; userInput.focus(); userInput.dispatchEvent(new Event('input')); }));
                actions.appendChild(makeActionBtn('撤回', () => retractMessage(wrap)));
            } else {
                actions.appendChild(makeActionBtn('重新生成', () => regenerate(wrap)));
            }
            wrap.appendChild(actions);
        }
        function makeActionBtn(label, onClick) {
            const b = document.createElement('button');
            b.textContent = label;
            b.onclick = onClick;
            return b;
        }
        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast('已复制')).catch(() => fallbackCopy(text));
            } else { fallbackCopy(text); }
        }
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta); showToast('已复制');
        }
        function retractMessage(userWrap) {
            let next = userWrap.nextElementSibling;
            while (next && next.classList && next.classList.contains('message')) {
                const after = next.nextElementSibling;
                if (next.classList.contains('assistant')) { next.remove(); break; }
                next = after;
            }
            userWrap.remove();
        }
        function regenerate(assistantWrap) {
            const q = lastUserQuery();
            assistantWrap.remove();
            if (q) { userInput.value = q; sendMessage(); }
        }
        function lastUserQuery() {
            const bubbles = chatInner.querySelectorAll('.message.user .bubble');
            return bubbles.length ? bubbles[bubbles.length - 1].textContent : '';
        }

        // ---------- markdown 渲染 ----------
        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function renderInline(text) {
            let lines = text.split('\n');
            let out = [];
            let inList = null;
            for (let line of lines) {
                const trimmed = line.trim();
                if (/^```/.test(trimmed)) { out.push(''); continue; }
                if (/^###\s+/.test(trimmed)) { out.push('<h3>' + inlineMarkup(trimmed.replace(/^###\s+/, '')) + '</h3>'); continue; }
                if (/^##\s+/.test(trimmed)) { out.push('<h2>' + inlineMarkup(trimmed.replace(/^##\s+/, '')) + '</h2>'); continue; }
                if (/^#\s+/.test(trimmed)) { out.push('<h1>' + inlineMarkup(trimmed.replace(/^#\s+/, '')) + '</h1>'); continue; }
                if (/^[-*]\s+/.test(trimmed)) {
                    if (inList !== 'ul') { out.push('<ul>'); inList = 'ul'; }
                    out.push('<li>' + inlineMarkup(trimmed.replace(/^[-*]\s+/, '')) + '</li>');
                    continue;
                }
                if (/^\d+\.\s+/.test(trimmed)) {
                    if (inList !== 'ol') { out.push('<ol>'); inList = 'ol'; }
                    out.push('<li>' + inlineMarkup(trimmed.replace(/^\d+\.\s+/, '')) + '</li>');
                    continue;
                }
                if (inList) { out.push(inList === 'ul' ? '</ul>' : '</ol>'); inList = null; }
                if (/^\|/.test(trimmed)) { out.push(''); continue; }
                if (trimmed === '') { out.push(''); continue; }
                out.push('<p>' + inlineMarkup(line) + '</p>');
            }
            if (inList) out.push(inList === 'ul' ? '</ul>' : '</ol>');
            return out.join('\n');
        }
        function inlineMarkup(s) {
            s = escapeHtml(s);
            s = s.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            return s;
        }
        function renderMarkdown(text) {
            if (!text) return '';
            const parts = text.split('```');
            let out = '';
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 1) {
                    let code = parts[i];
                    let lang = '';
                    const nl = code.indexOf('\n');
                    if (nl !== -1) { lang = code.slice(0, nl).trim(); code = code.slice(nl + 1); }
                    out += `<div class="code-block"><div class="code-header"><span>${escapeHtml(lang || 'code')}</span><button class="code-copy">复制</button></div><pre><code>${escapeHtml(code)}</code></pre></div>`;
                } else {
                    out += renderInline(parts[i]);
                }
            }
            return out;
        }

        // 代码块复制（事件委托）
        chatInner.addEventListener('click', e => {
            if (e.target.classList && e.target.classList.contains('code-copy')) {
                const code = e.target.closest('.code-block').querySelector('code').textContent;
                copyText(code);
            }
        });

        // ---------- 联网检索 ----------
        function updateSourceTypes() {
            const webChecked = document.getElementById('chk-web')?.checked || false;
            selectedSourceTypes = ['default', 'user_upload'];
            if (webChecked) selectedSourceTypes.push('web_search');
        }

        // ---------- 发送 ----------
        async function sendMessage() {
            if (streaming) { abortController && abortController.abort(); return; }
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            userInput.style.height = 'auto';

            const userMsg = appendMessage('user', text);
            addMessageActions(userMsg.wrap, 'user', text);

            const assistantMsg = appendMessage('assistant', '');
            assistantMsg.bubble.classList.add('typing-cursor');
            let answerText = '';
            let thinkText = '';
            let thinkPanel = null;

            streaming = true;
            abortController = new AbortController();
            sendBtn.textContent = '■';
            sendBtn.classList.add('stop');

            try {
                if (selectedSourceTypes.includes('web_search')) {
                    try {
                        await fetch('/api/knowledge/web-search/ingest', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': AUTH_TOKEN },
                            body: JSON.stringify({ query: text, limit: 5 }),
                        });
                    } catch (e) { console.warn('[联网检索] 失败（不影响对话）', e); }
                }

                const resp = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': AUTH_TOKEN },
                    body: JSON.stringify({ user_id: 'web_user', query: text, session_id: currentSessionId, source_types: selectedSourceTypes }),
                    signal: abortController.signal,
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const events = buffer.split('\n\n');
                    buffer = events.pop();
                    for (const raw of events) {
                        if (!raw.trim()) continue;
                        let type = 'message', dataStr = '';
                        for (const line of raw.split('\n')) {
                            if (line.startsWith('event:')) type = line.slice(6).trim();
                            else if (line.startsWith('data:')) dataStr = line.slice(5).trim();
                        }
                        if (type === 'token') {
                            try {
                                const p = JSON.parse(dataStr);
                                answerText += p.text || '';
                                assistantMsg.bubble.textContent = answerText;
                            } catch (e) {}
                            if (autoScroll) scrollToBottom();
                        } else if (type === 'thought') {
                            try { thinkText += JSON.parse(dataStr); } catch (e) { thinkText += dataStr; }
                            if (!thinkPanel) thinkPanel = addThinkPanel(assistantMsg.wrap);
                            thinkPanel.querySelector('.think-body').textContent = thinkText;
                            if (autoScroll) scrollToBottom();
                        } else if (type === 'error') {
                            answerText += '\n\n⚠️ ' + dataStr;
                        } else if (type === 'done') {
                            // 流式结束
                        }
                    }
                }

                assistantMsg.bubble.classList.remove('typing-cursor');
                assistantMsg.bubble.innerHTML = renderMarkdown(answerText) || '（未返回内容）';
                addMessageActions(assistantMsg.wrap, 'assistant', answerText);

            } catch (err) {
                assistantMsg.bubble.classList.remove('typing-cursor');
                if (err.name !== 'AbortError') {
                    assistantMsg.bubble.textContent = '请求失败：' + err.message;
                } else {
                    assistantMsg.bubble.textContent = (answerText || '') + ' （已停止）';
                }
                addMessageActions(assistantMsg.wrap, 'assistant', answerText);
            } finally {
                streaming = false;
                abortController = null;
                sendBtn.textContent = '➤';
                sendBtn.classList.remove('stop');
                userInput.focus();
                loadConversations();
            }
        }

        function addThinkPanel(wrap) {
            const panel = document.createElement('div');
            panel.className = 'think-panel';
            panel.innerHTML = `<button class="think-toggle" onclick="this.nextElementSibling.classList.toggle('open')">🧠 深度思考</button><div class="think-body"></div>`;
            wrap.appendChild(panel);
            return panel;
        }

        // ---------- 会话列表 ----------
        function groupLabel(iso) {
            if (!iso) return '更早';
            const d = new Date(iso);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today.getTime() - 86400000);
            if (d >= today) return '今天';
            if (d >= yesterday) return '昨天';
            return '更早';
        }
        async function loadConversations() {
            try {
                const resp = await fetch('/api/conversations', { headers: { 'Authorization': AUTH_TOKEN } });
                const data = await resp.json();
                const convs = (data.conversations || []).slice().sort((a, b) => (b.updated_at || '') > (a.updated_at || '') ? 1 : -1);
                const list = document.getElementById('conv-list');
                let html = '';
                let lastGroup = '';
                for (const c of convs) {
                    const g = groupLabel(c.updated_at);
                    if (g !== lastGroup) { html += `<div class="conv-group-label">${g}</div>`; lastGroup = g; }
                    const title = c.title || '新对话';
                    html += `<div class="conv-item${c.session_id === currentSessionId ? ' active' : ''}" onclick="selectConversation('${c.session_id}')">
                        <span class="conv-title">${escapeHtml(title)}</span>
                        <span class="conv-actions">
                            <button onclick="event.stopPropagation(); renameConversation('${c.session_id}')" title="重命名">✏️</button>
                            <button onclick="event.stopPropagation(); deleteConversation('${c.session_id}')" title="删除">🗑</button>
                        </span>
                    </div>`;
                }
                list.innerHTML = html || '<div class="conv-group-label">暂无对话</div>';
            } catch (e) { console.error('加载会话失败', e); }
        }
        async function selectConversation(sessionId) {
            if (sessionId === currentSessionId) return;
            currentSessionId = sessionId;
            localStorage.setItem('tax_agent_session_id', sessionId);
            chatInner.innerHTML = '';
            document.getElementById('main-title').textContent = '加载中…';
            try {
                const resp = await fetch(`/api/conversations/${sessionId}/messages`, { headers: { 'Authorization': AUTH_TOKEN } });
                const data = await resp.json();
                document.getElementById('main-title').textContent = data.title || '税务智能助手';
                if (data.messages) {
                    for (const m of data.messages) {
                        const msg = appendMessage(m.role === 'user' ? 'user' : 'assistant', m.content);
                        if (m.role === 'assistant') msg.bubble.innerHTML = renderMarkdown(m.content || '');
                        addMessageActions(msg.wrap, m.role === 'user' ? 'user' : 'assistant', m.content || '');
                    }
                }
            } catch (e) { console.error('加载历史失败', e); }
            loadConversations();
            toggleSidebar(false);
        }
        function newConversation() {
            currentSessionId = 'session_' + Date.now();
            localStorage.setItem('tax_agent_session_id', currentSessionId);
            chatInner.innerHTML = `<div class="welcome" id="welcome"><h2>你好，我是税务助手</h2><p>我可以帮你解答发票合规、增值税、企业所得税、个人所得税等问题</p><div class="suggestion-grid" id="suggestion-grid"></div></div>`;
            renderSuggestions();
            document.getElementById('main-title').textContent = '税务智能助手';
            loadConversations();
            userInput.focus();
            toggleSidebar(false);
        }
        async function deleteConversation(sessionId) {
            if (!confirm('确定删除这个对话吗？')) return;
            try {
                await fetch(`/api/conversations/${sessionId}`, { method: 'DELETE', headers: { 'Authorization': AUTH_TOKEN } });
                if (sessionId === currentSessionId) newConversation();
                else loadConversations();
            } catch (e) { showToast('删除失败', true); }
        }
        async function renameConversation(sessionId) {
            const cur = [...document.querySelectorAll('.conv-item')].find(x => x.onclick && x.textContent.includes(sessionId))?.querySelector('.conv-title')?.textContent || '';
            const title = prompt('重命名对话：', cur);
            if (!title || title.trim() === '') return;
            try {
                const resp = await fetch(`/api/conversations/${sessionId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'Authorization': AUTH_TOKEN },
                    body: JSON.stringify({ title: title.trim() }),
                });
                if (resp.ok) {
                    if (sessionId === currentSessionId) document.getElementById('main-title').textContent = title.trim();
                    loadConversations();
                }
            } catch (e) { showToast('重命名失败', true); }
        }

        // ---------- 文件上传 ----------
        async function handleFiles(files) {
            for (const f of files) {
                const formData = new FormData();
                formData.append('file', f);
                try {
                    const resp = await fetch('/api/knowledge/upload', { method: 'POST', headers: { 'Authorization': AUTH_TOKEN }, body: formData });
                    const data = await resp.json();
                    if (data.status === 'success') showToast(`已上传：${f.name}`);
                    else showToast('上传失败：' + (data.message || '未知'), true);
                } catch (e) { showToast('上传失败', true); }
            }
        }
        // 拖拽上传
        const composer = document.getElementById('composer');
        composer.addEventListener('dragover', e => { e.preventDefault(); });
        composer.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

        // ---------- 模型选择 ----------
        async function loadModels() {
            try {
                const resp = await fetch('/api/settings', { headers: { 'Authorization': AUTH_TOKEN } });
                const data = await resp.json();
                const sel = document.getElementById('model-select');
                sel.innerHTML = '';
                (data.known_models || []).forEach(m => {
                    if (m.value.startsWith('glm') || m.value.startsWith('deepseek')) {
                        const opt = document.createElement('option');
                        opt.value = m.value; opt.textContent = m.label;
                        if (m.value === data.config.llm.model) opt.selected = true;
                        sel.appendChild(opt);
                    }
                });
            } catch (e) {}
        }
        async function onModelChange() {
            const model = document.getElementById('model-select').value;
            if (!model) return;
            try {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': AUTH_TOKEN },
                    body: JSON.stringify({ llm: { model } }),
                });
                showToast('模型已切换，下次对话生效');
            } catch (e) { showToast('切换失败', true); }
        }

        // ---------- 设置弹窗 ----------
        async function loadSettings() {
            try {
                const resp = await fetch('/api/settings', { headers: { 'Authorization': AUTH_TOKEN } });
                const data = await resp.json();
                const cfg = data.config;
                const llm = document.getElementById('cfg-llm-model');
                llm.innerHTML = ''; (data.known_models || []).forEach(m => {
                    const o = document.createElement('option'); o.value = m.value; o.textContent = m.label;
                    if (m.value === cfg.llm.model) o.selected = true; llm.appendChild(o);
                });
                document.getElementById('cfg-llm-key').value = cfg.llm.api_key;
                document.getElementById('cfg-llm-url').value = cfg.llm.base_url;
                const emb = document.getElementById('cfg-emb-model');
                emb.innerHTML = ''; (data.known_models || []).forEach(m => {
                    const o = document.createElement('option'); o.value = m.value; o.textContent = m.label;
                    if (m.value === cfg.embedding.model) o.selected = true; emb.appendChild(o);
                });
                document.getElementById('cfg-emb-key').value = cfg.embedding.api_key;
                document.getElementById('cfg-emb-url').value = cfg.embedding.base_url;
            } catch (e) {}
        }
        function showSettings() { loadSettings(); document.getElementById('settings-modal').classList.add('show'); }
        function closeSettings() { document.getElementById('settings-modal').classList.remove('show'); }
        async function saveSettings() {
            const body = {
                llm: { model: document.getElementById('cfg-llm-model').value, api_key: document.getElementById('cfg-llm-key').value, base_url: document.getElementById('cfg-llm-url').value },
                embedding: { model: document.getElementById('cfg-emb-model').value, api_key: document.getElementById('cfg-emb-key').value, base_url: document.getElementById('cfg-emb-url').value },
            };
            try {
                await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': AUTH_TOKEN }, body: JSON.stringify(body) });
                closeSettings(); showToast('✅ 配置已保存');
                loadModels();
            } catch (e) { showToast('保存失败', true); }
        }

        // ---------- 用户信息 / 开发者入口 ----------
        async function loadMe() {
            try {
                const resp = await fetch('/api/me', { headers: { 'Authorization': AUTH_TOKEN } });
                const data = await resp.json();
                document.getElementById('me-label').textContent = data.is_developer ? '开发者' : '';
                document.getElementById('settings-btn').style.display = data.is_developer ? '' : 'none';
            } catch (e) {
                document.getElementById('settings-btn').style.display = 'none';
            }
        }

        // ---------- 初始化 ----------
        initTheme();
        renderSuggestions();
        loadConversations();
        loadModels();
        loadMe();
        toggleSidebar(window.innerWidth > 768);
    </script>
</body>
